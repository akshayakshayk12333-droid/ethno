services:
  db:
    image: postgres:15
    container_name: voicebridge-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voicebridge
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voicebridge-server
    env_file:
      - ./server/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/voicebridge?schema=public
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: voicebridge-client
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
